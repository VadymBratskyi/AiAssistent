[project]
name = "assistant"
version = "0.1.0"
description = "Personal AI assistant accessible via Telegram, running in local Rancher"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[rate-limiter]==21.6",
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.1",
    "faster-whisper>=1.0.3",
    "msal>=1.31.0",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
assistant = "assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
