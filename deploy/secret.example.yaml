# Copy to secret.yaml, fill in values, then:
#   kubectl apply -f deploy/secret.yaml
# secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: assistant-secrets
  namespace: default
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_ALLOWED_CHAT_IDS: ""
  ANTHROPIC_API_KEY: ""
  ANTHROPIC_MODEL: "claude-opus-4-7"
  LOG_LEVEL: "INFO"
